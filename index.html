<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parisse &amp; Mori</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,#56202a 0%,#430912 55%,#2e080e 100%);color:#f5eadb;padding:32px;font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:680px}
.kicker{font:500 10px/1.6 Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#d8b7a0}
h1{font-size:clamp(44px,9vw,86px);font-weight:normal;line-height:1.08;margin:22px 0}
p{font-size:clamp(15px,3vw,19px);line-height:1.7;color:#e2c9b9}
</style>
</head>
<body>
<main class="wrap">
<p class="kicker">A little something is on its way</p>
<h1>Parisse &amp; Mori</h1>
<p>Our invitation is being prepared with love.</p>
</main>
</body>
</html>
